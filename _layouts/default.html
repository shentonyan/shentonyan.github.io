<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% feed_meta %}
  {% seo %}
  <script>
    (function() {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (_) {}
      theme = theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
          <span id="theme-icon"></span>
        </button>
      </nav>
    </div>
  </header>

  <main class="page-content wrapper" id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>©️ {{ 'now' | date: '%Y' }} by Sivan Yan &nbsp;|&nbsp; Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a> &amp; <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a></p>
    </div>
  </footer>

  <script>
    (function() {
      var btn = document.getElementById('theme-toggle');
      var icon = document.getElementById('theme-icon');

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        var dark = theme === 'dark';
        icon.textContent = dark ? '☀️' : '🌙';
        btn.setAttribute('aria-pressed', String(dark));
        var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        btn.setAttribute('aria-label', label);
        btn.title = label;
        try { localStorage.setItem('theme', theme); } catch (_) {}
      }

      var current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current);

      btn.addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });
    })();
  </script>
</body>
</html>
